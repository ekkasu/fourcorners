# Render Blueprint: one free web service that builds the game and runs server/index.js,
# which serves the built files and the multiplayer rooms (/ws) on Render's port.
services:
  - type: web
    name: four-corners
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
